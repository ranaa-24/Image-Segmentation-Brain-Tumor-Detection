<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brain MRI tumor segmentation</title>
    <style>
      :root {
        --bg: #050914;
        --bg-2: #0b1222;
        --line: rgba(174, 198, 255, 0.16);
        --text: #eef3ff;
        --muted: #9aa9c3;
        --accent: #9baeff;
        --accent-2: #a5eaff;
        --bad: #ff929c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        position: relative;
        min-height: 100vh;
        background:linear-gradient(145deg, var(--bg), var(--bg-2));
        color: var(--text);
        font:
          15px/1.5 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body::before {
        position: fixed;
        z-index: 0;
        inset: 0;
        background-image:
          linear-gradient(rgba(174, 198, 255, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(174, 198, 255, 0.07) 1px, transparent 1px);
        background-size: 32px 32px;
        -webkit-mask-image: radial-gradient(
          ellipse at center,
          #000 20%,
          transparent 90%
        );
        mask-image: radial-gradient(
          ellipse at center,
          #000 20%,
          transparent 90%
        );
        content: "";
        pointer-events: none;
        animation: gridFlow 30s linear infinite;
      }
      main {
        position: relative;
        z-index: 1;
        width: min(100% - 40px, 1040px);
        margin: 0 auto;
        padding: 54px 0 30px;
      }
      header {
        margin-bottom: 42px;
      }
      .intro {
        max-width: 760px;
        margin: 0 auto 36px;
        text-align: center;
        animation: fadeIn 0.28s ease-out both;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5vw, 3.5rem);
        line-height: 1.04;
        font-weight: 550;
        letter-spacing: -0.06em;
      }
      p.sub {
        margin: 13px 0 0;
        color: var(--muted);
        font-size: 15px;
      }
      .drop {
        display: flex;
        width: max-content;
        max-width: 100%;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        gap: 11px;
        margin: 0 auto;
        padding: 0 21px;
        border: 1px solid rgba(174, 198, 255, 0.26);
        border-radius: 13px;
        color: white;
        background: linear-gradient(
          135deg,
          rgba(127, 153, 236, 0.9),
          rgba(91, 122, 207, 0.9)
        );
        box-shadow: 0 8px 28px rgba(72, 100, 190, 0.2);
        font-weight: 600;
        cursor: pointer;
        transition:
          filter 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.2s ease;
      }
      .drop:hover {
        filter: brightness(1.04);
        box-shadow: 0 12px 24px rgba(92, 120, 255, 0.32);
        transform: translateY(-1px);
      }
      .drop svg {
        width: 18px;
        height: 18px;
      }
      .drop:focus-within,
      button:focus-visible {
        outline: 3px solid rgba(165, 202, 255, 0.45);
        outline-offset: 3px;
      }
      input[type="file"] {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .hint {
        margin: 11px 0 0;
        color: var(--muted);
        text-align: center;
        font-size: 12px;
      }
      .action-row {
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      button {
        display: none;
        padding: 10px 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--text);
        background: rgba(142, 165, 220, 0.12);
        backdrop-filter: blur(14px);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition:
          border-color 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }
      button:hover:not(:disabled) {
        border-color: rgba(124, 156, 255, 0.7);
        color: var(--accent-2);
        transform: translateY(-1px);
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .views {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-top: 20px;
        animation: riseIn 0.35s ease-out both;
      }
      .views[hidden] {
        display: none;
      }
      figure {
        min-width: 0;
        margin: 0;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: linear-gradient(
          145deg,
          rgba(151, 176, 230, 0.1),
          rgba(77, 99, 151, 0.07)
        );
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(18px);
        animation: riseIn 0.4s ease-out both;
        transition:
          border-color 0.2s ease,
          transform 0.2s ease;
      }
      figure:hover {
        border-color: rgba(174, 198, 255, 0.3);
        transform: translateY(-2px);
      }
      figure:nth-child(2) {
        animation-delay: 0.06s;
      }
      figure:nth-child(3) {
        animation-delay: 0.12s;
      }
      figure[hidden] {
        display: none;
      }
      figure img {
        display: block;
        width: 100%;
        height: 260px;
        object-fit: contain;
        border-radius: 10px;
        background: rgba(3, 8, 19, 0.5);
      }
      figcaption {
        padding: 11px 5px 3px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }
      #result {
        min-height: 20px;
        margin: 12px auto 0;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
      }
      #result:empty {
        display: none;
      }
      .err {
        color: var(--bad);
      }
      .note {
        margin: 56px 0 0;
        padding-top: 20px;
        border-top: 1px solid rgba(174, 198, 255, 0.1);
        color: #818da5;
        text-align: center;
        font-size: 12px;
      }
      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes gridFlow {
        to {
          background-position: 32px 32px;
        }
      }
      @media (max-width: 680px) {
        main {
          width: calc(100% - 28px);
          padding-top: 42px;
        }
        .views {
          grid-template-columns: 1fr;
          gap: 11px;
        }
        figure {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 100px;
          align-items: center;
          gap: 10px;
        }
        figure img {
          height: 120px;
        }
        figcaption {
          padding: 8px;
        }
        .note {
          margin-top: 42px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro">
        <h1>Brain MRI Segmentation</h1>
        <p class="sub">
          Upload a slice to view the predicted tumor segmentation.
        </p>
      </section>

      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/png,image/jpeg,image/tiff" />
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"
          />
        </svg>
        <span id="label">Choose an MRI image</span>
      </label>
      <p class="hint">PNG, JPG or TIF · single 2D slice</p>
      <div class="action-row">
        <button id="run" disabled>Run segmentation</button>
      </div>

      <div id="result" aria-live="polite"></div>
      <div class="views" id="views" hidden>
        <figure>
          <img id="o" alt="Original MRI slice preview" />
          <figcaption>Original slice</figcaption>
        </figure>
        <figure hidden>
          <img id="v" alt="MRI slice with predicted tumor overlay" />
          <figcaption>Overlay</figcaption>
        </figure>
        <figure hidden>
          <img id="m" alt="Predicted binary tumor mask" />
          <figcaption>Mask</figcaption>
        </figure>
      </div>
    </main>

    <script>
      const file = document.getElementById("file"),
        run = document.getElementById("run"),
        label = document.getElementById("label"),
        result = document.getElementById("result"),
        views = document.getElementById("views"),
        original = document.getElementById("o");
      let previewUrl;

      file.addEventListener("change", () => {
        const f = file.files[0];
        label.textContent = f ? f.name : "Choose an MRI image";
        run.disabled = !f;
        run.style.display = f ? "inline-block" : "none";
        result.textContent = "";
        result.className = "";
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        if (f) {
          previewUrl = URL.createObjectURL(f);
          original.src = previewUrl;
          views.hidden = false;
          document.getElementById("v").removeAttribute("src");
          document.getElementById("m").removeAttribute("src");
        } else {
          views.hidden = true;
        }
      });

      run.addEventListener("click", async () => {
        const fd = new FormData();
        fd.append("image", file.files[0]);
        run.disabled = true;
        run.textContent = "Working…";
        result.textContent = "";
        try {
          const r = await fetch("/predict", { method: "POST", body: fd });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || "Request failed.");
          original.src = d.original;
          document.getElementById("v").src = d.overlay;
          document.getElementById("m").src = d.mask;
          document.getElementById("v").closest("figure").hidden = false;
          document.getElementById("m").closest("figure").hidden = false;
          views.hidden = false;
          result.className = "";
          result.textContent = d.found
            ? `Predicted region: ${d.area_pct}% · Mean confidence: ${d.confidence}`
            : "No region predicted in this slice.";
        } catch (e) {
          result.className = "err";
          result.textContent = e.message;
        } finally {
          run.disabled = false;
          run.textContent = "Run segmentation";
        }
      });
    </script>
  </body>
</html>
